<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Riverbank — Foam Lace</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #cfe8ef;
        font-family: system-ui, sans-serif;
      }
      #hud {
        position: fixed;
        z-index: 1;
        left: 18px;
        bottom: 18px;
        color: #12313a;
        background: rgba(255, 255, 255, 0.62);
        backdrop-filter: blur(6px);
        padding: 12px 16px;
        border-radius: 12px;
        max-width: 280px;
        user-select: none;
        box-shadow: 0 4px 18px rgba(0, 0, 0, 0.12);
      }
      #hud h1 {
        font-size: 15px;
        margin: 0 0 2px;
        font-weight: 700;
      }
      #hud p {
        font-size: 12px;
        margin: 0 0 10px;
        opacity: 0.75;
        line-height: 1.4;
      }
      #corner {
        position: fixed;
        z-index: 1;
        right: 18px;
        top: 16px;
        color: #12313a;
        font-size: 11.5px;
        opacity: 0.65;
        background: rgba(255, 255, 255, 0.5);
        padding: 6px 10px;
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <div id="hud">
      <h1>Riverbank — Foam Lace</h1>
      <p>Fine layered ripples fringe the shore with a lacy foam edge, drifting in winding flow trails.</p>
    </div>
    <div id="corner">drag to orbit · scroll to zoom</div>
    <script src="bundle.js" defer></script>
  </body>
</html>
