<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Riverbank Rolling Waves</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #13182f;
        font-family: system-ui, sans-serif;
      }
      #panel {
        position: fixed;
        left: 16px;
        top: 16px;
        color: #fff;
        background: rgba(10, 20, 30, 0.55);
        padding: 10px 14px;
        border-radius: 10px;
        max-width: 260px;
        user-select: none;
      }
      #variant-title {
        font-size: 15px;
        font-weight: 600;
      }
      #variant-desc {
        font-size: 12px;
        opacity: 0.8;
        margin-top: 2px;
        margin-bottom: 8px;
      }
      #variant-buttons {
        display: flex;
        gap: 6px;
      }
      .variant-btn {
        width: 28px;
        height: 28px;
        border-radius: 6px;
        border: 1px solid rgba(255, 255, 255, 0.3);
        background: rgba(255, 255, 255, 0.12);
        color: #fff;
        cursor: pointer;
        font-size: 13px;
      }
      .variant-btn:hover {
        background: rgba(255, 255, 255, 0.22);
      }
      .variant-btn.active {
        background: #ffcf5c;
        color: #1a1a1a;
        border-color: #ffcf5c;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <script src="bundle.js" defer></script>
  </body>
</html>
